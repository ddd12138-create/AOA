# simulation only, not fixture
#
# Synthetic UCA radius for MUSIC regression (tests/golden/theta30_m4).
# Do not copy this R_m onto the hardware jig file configs/array_uca_m4.yaml
# (that file must stay R_m: null until the fixture is measured).
# Do not use HFSS "半径 xx mm" from 阵列天线/优化结果/.
schema_version: 1
array_type: UCA
M: 4
element_ids: [1, 3, 5, 7]
R_m: 0.15
phi_deg: [0.0, 90.0, 180.0, 270.0]
north_offset_deg: 0.0
# Repo-root relative CalibFile. identity.yaml means uncalibrated (do not overwrite it).
# After `python -m calib --replay tests/golden/theta30_m4 --theta-deg 30
#   --array configs/array_uca_m4_sim.yaml --out calib/sim_theta30.yaml`,
# point this at the new file, e.g. calib/sim_theta30.yaml.
calib_path: calib/identity.yaml
