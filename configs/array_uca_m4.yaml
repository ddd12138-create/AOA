# Uniform circular array — 4-element subset (default / transition).
# Physical array is 8 elements at 45°. Live hardware uses elements 1,3,5,7 (90°).
schema_version: 1
array_type: UCA
M: 4
element_ids: [1, 3, 5, 7]
# R_m: UCA radius in metres, centre of fixture → element reference (feed).
# Measure on the wooden/3D-printed jig with a tape or drawing.
# Do NOT copy HFSS "半径 xx mm" files under 阵列天线/优化结果/ (those are
# per-element phase-centre offsets, e.g. 21.25 mm at 2.4 GHz).
R_m: null
# Azimuth of each used element, degrees, CCW from array 0° axis (top view).
# Element 1 defines the array 0° axis; mark it on the fixture.
phi_deg: [0.0, 90.0, 180.0, 270.0]
# Bearing of array 0° axis, clockwise from true north. 0 = unsurveyed.
north_offset_deg: 0.0
calib_path: calib/identity.yaml
